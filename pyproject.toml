[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usine-autonome"
dynamic = ["version"]
description = "Système Multi-Agents de Pilotage d'une Usine Autonome"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<0.28",
    "scikit-learn>=1.5,<1.6",
    "joblib>=1.4,<2",
    "numpy>=1.26,<2",
    "streamlit>=1.39,<1.40",
    "pandas>=2.2,<3",
    "plotly>=5.24,<6",
]

[project.scripts]
usine = "app.cli:main"

[tool.setuptools]
packages = ["app", "agents", "agents.production", "agents.maintenance",
            "agents.quality", "agents.inventory", "agents.energy",
            "agents.supervisor", "api", "ui"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
